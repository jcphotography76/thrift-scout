<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thrift Scout / Thrift-Vault</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b21;
      --surface: #222630;
      --border: #2d3340;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --ebay: #0064d2;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      padding-bottom: 60px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-title span {
      color: var(--green);
    }
    .btn-key {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--panel);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .mode-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .mode-btn.active {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .portfolio-banner {
      background: linear-gradient(135deg, #181b21 0%, #1f242d 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .portfolio-metric {
      display: flex;
      flex-direction: column;
    }
    .portfolio-metric .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .portfolio-metric .val {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--green);
    }
    .action-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .btn-action:active {
      background: var(--accent-hover);
    }
    input[type="file"] {
      display: none;
    }
    .status-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      border-left: 4px solid var(--accent);
      background: var(--panel);
    }
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .vault-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      position: relative;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }
    .card-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .badge-signal {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 4px;
      color: #000;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .card-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--green);
      margin: 8px 0;
    }
    .card-val span {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-muted);
    }
    .card-summary {
      font-size: 0.8rem;
      color: #d1d5db;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .btn-comp {
      display: inline-block;
      background: var(--ebay);
      color: #fff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      width: fit-content;
    }
    #detailModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      z-index: 100;
      overflow-y: auto;
      padding: 16px;
    }
    .modal-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn-back {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .modal-img {
      width: 100%;
      max-height: 340px;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .modal-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    .modal-section strong {
      display: block;
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">THRIFT-VAULT <span>• AI</span></div>
    <button class="btn-key" onclick="promptApiKey()">API Key</button>
  </header>

  <div class="mode-toggle">
    <button id="modeScout" class="mode-btn active" onclick="switchMode('scout')">Thrift Scout Mode</button>
    <button id="modeOwned" class="mode-btn" onclick="switchMode('owned')">Owned Inventory</button>
  </div>

  <div class="portfolio-banner">
    <div class="portfolio-metric">
      <span class="label">Owned Valuation</span>
      <span class="val" id="portfolioTotal">$0.00</span>
    </div>
    <div class="portfolio-metric" style="align-items: flex-end;">
      <span class="label">Total Items</span>
      <span class="val" id="portfolioCount" style="color: #fff;">0</span>
    </div>
  </div>

  <div class="action-panel">
    <label class="btn-action" for="cameraInput">
      📷 Scan Item Appraisal
    </label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processCapture(this)">
  </div>

  <div id="statusAlert" class="status-alert"></div>
  <div id="cardsFeed" class="feed-container"></div>

  <div id="detailModal">
    <div class="modal-nav">
      <button class="btn-back" onclick="closeDetail()">← Back to Scanner</button>
      <span style="font-weight: 700; font-size: 0.9rem;">Appraisal Details</span>
    </div>
    <img id="modalImage" class="modal-img" src="" alt="Captured Asset">
    <div id="modalContent"></div>
  </div>

  <script>
    const SYSTEM_PROMPT = `
You are Thrift-Vault AI, an expert secondary-market appraiser.
Analyze the provided image(s) and output strictly in the following 8-section labeled format. Do not use markdown tables or unstructured bullet points outside these labels.

[ITEM_IDENTIFICATION]
Brand: <Brand>
Model/Item: <Model or Name>
Era/Size/Specs: <Era, Size, Capacity, or Variant>

[VALUATION_COMPS]
Sold Average: $<Fair Market Value in USD as a number>
Price Range: $<Low> - $<High>
Confidence: <High | Medium | Low>

[DISPOSITION_SIGNAL]
Signal: <GREEN | YELLOW | RED>
Reason: <1 concise sentence justifying the signal based on sell-through velocity or depreciation>

[MARKETPLACE_ROUTING]
Primary Platform: <eBay | Mercari | Poshmark | Etsy | Local (OfferUp/FB Marketplace)>
Listing Strategy: List at $<Optimal List Price>, floor at $<Minimum Acceptable Offer>

[SHIPPING_PROTOCOL]
Tier: <Under 16 oz | 1-5 lbs | 5+ lbs / Oversized>
Packaging: <Poly Mailer | Padded Flat Rate | Boxed | Double-Box Fragile>
Recommended Service: <USPS Ground Advantage | USPS Priority Mail | UPS Ground>

[TECHNICAL_INTEL]
<Key authentication markers, flaws to check, hardware specs, or tag details>

[COMP_SEARCH_QUERY]
<Optimized keyword string for eBay sold search, e.g., "WD Black 5TB P10 Game Drive">

[APPRAISAL_VERDICT]
<BUY TO FLIP | PASS | PERSONAL KEEP | CURRENT ASSET VALUE>
`;

    let currentAppMode = 'scout';

    window.addEventListener('DOMContentLoaded', () => {
      updatePortfolioMetrics();
      loadActiveFeed();
    });

    function promptApiKey() {
      const stored = localStorage.getItem('thrift_gemini_key') || '';
      const input = prompt('Enter Google AI Studio API Key:', stored);
      if (input !== null) {
        localStorage.setItem('thrift_gemini_key', input.trim());
        triggerAlert('API Key saved.');
      }
    }

    function switchMode(mode) {
      currentAppMode = mode;
      document.getElementById('modeScout').classList.toggle('active', mode === 'scout');
      document.getElementById('modeOwned').classList.toggle('active', mode === 'owned');
      loadActiveFeed();
    }

    function triggerAlert(msg, isError = false) {
      const box = document.getElementById('statusAlert');
      box.style.display = 'block';
      box.style.borderLeftColor = isError ? 'var(--red)' : 'var(--accent)';
      box.textContent = msg;
    }

    function dismissAlert() {
      document.getElementById('statusAlert').style.display = 'none';
    }

    async function processCapture(input) {
      const file = input.files[0];
      if (!file) return;

      const key = localStorage.getItem('thrift_gemini_key');
      if (!key) {
        alert('API Key missing. Please provide your Google AI Studio key.');
        promptApiKey();
        return;
      }

      triggerAlert('Compressing image to 1000px...');
      const base64Data = await resizeCanvas(file, 1000, 1000);

      triggerAlert('Consulting Gemini 3.6-flash valuation engine...');
      runAppraisal(base64Data, key);
      input.value = '';
    }

    function resizeCanvas(file, maxW, maxH) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxW) {
                h = Math.round((h * maxW) / w);
                w = maxW;
              }
            } else {
              if (h > maxH) {
                w = Math.round((w * maxH) / h);
                h = maxH;
              }
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function runAppraisal(fullBase64, key, retries = 1) {
      const rawPayload = fullBase64.split(',')[1];
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`;

      const body = {
        contents: [{
          parts: [
            { text: SYSTEM_PROMPT },
            { inline_data: { mime_type: 'image/jpeg', data: rawPayload } }
          ]
        }]
      };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (response.status === 503 && retries > 0) {
          triggerAlert('API 503 capacity limit. Retrying in 2 seconds...');
          await new Promise(r => setTimeout(r, 2000));
          return runAppraisal(fullBase64, key, retries - 1);
        }

        if (response.status === 429) {
          throw new Error('Quota exceeded (429). Please wait a moment before trying again.');
        }

        if (!response.ok) {
          throw new Error(`API error: ${response.status} ${response.statusText}`);
        }

        const resData = await response.json();
        const text = resData.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error('Model produced no response.');

        dismissAlert();
        const appraisal = parseResponseData(text, fullBase64);
        persistAppraisal(appraisal);
        updatePortfolioMetrics();
        loadActiveFeed();

      } catch (err) {
        triggerAlert(err.message, true);
      }
    }

    function parseResponseData(rawText, imageUri) {
      const clean = rawText.replace(/[*#]/g, '');

      const extract = (sec) => {
        const pattern = new RegExp(`\\[${sec}\\]([\\s\\S]*?)(?=\\[[A-Z_]+\\]|$)`, 'i');
        const match = clean.match(pattern);
        return match ? match[1].trim() : 'N/A';
      };

      const idBlock = extract('ITEM_IDENTIFICATION');
      const valBlock = extract('VALUATION_COMPS');
      const dispBlock = extract('DISPOSITION_SIGNAL');
      const routeBlock = extract('MARKETPLACE_ROUTING');
      const shipBlock = extract('SHIPPING_PROTOCOL');
      const intelBlock = extract('TECHNICAL_INTEL');
      const queryBlock = extract('COMP_SEARCH_QUERY');
      const verdictBlock = extract('APPRAISAL_VERDICT');

      const getVal = (block, key) => {
        const match = block.match(new RegExp(`${key}:\\s*(.+)`, 'i'));
        return match ? match[1].trim() : null;
      };

      const sigMatch = dispBlock.match(/Signal:\s*(GREEN|YELLOW|RED)/i);
      const signal = sigMatch ? sigMatch[1].toUpperCase() : 'YELLOW';

      const avgMatch = valBlock.match(/Sold Average:\s*\$?([\d,]+(\.\d{2})?)/i);
      const estValue = avgMatch ? parseFloat(avgMatch[1].replace(/,/g, '')) : 0.00;

      const brand = getVal(idBlock, 'Brand') || 'Unknown Brand';
      const item = getVal(idBlock, 'Model/Item') || 'Item';

      return {
        id: Date.now(),
        image: imageUri,
        brand: brand,
        item: item,
        specs: getVal(idBlock, 'Era/Size/Specs') || 'N/A',
        estimatedValue: estValue,
        priceRange: getVal(valBlock, 'Price Range') || '$0 - $0',
        disposition: {
          signal: signal,
          reason: getVal(dispBlock, 'Reason') || 'No rationale available.'
        },
        routing: {
          platform: getVal(routeBlock, 'Primary Platform') || 'eBay',
          strategy: getVal(routeBlock, 'Listing Strategy') || 'Standard fixed-price'
        },
        shipping: {
          tier: getVal(shipBlock, 'Tier') || 'Standard Parcel',
          packaging: getVal(shipBlock, 'Packaging') || 'Boxed',
          service: getVal(shipBlock, 'Recommended Service') || 'USPS Ground Advantage'
        },
        intel: intelBlock,
        searchQuery: queryBlock !== 'N/A' ? queryBlock : `${brand} ${item}`,
        verdict: verdictBlock,
        date: new Date().toLocaleDateString()
      };
    }

    function persistAppraisal(item) {
      const storageKey = currentAppMode === 'scout' ? 'thrift_scout_history' : 'thrift_owned_inventory';
      const list = JSON.parse(localStorage.getItem(storageKey) || '[]');
      list.unshift(item);
      localStorage.setItem(storageKey, JSON.stringify(list));
    }

    function updatePortfolioMetrics() {
      const owned = JSON.parse(localStorage.getItem('thrift_owned_inventory') || '[]');
      const total = owned.reduce((sum, item) => sum + (Number(item.estimatedValue) || 0), 0);
      document.getElementById('portfolioTotal').textContent = `$${total.toFixed(2)}`;
      document.getElementById('portfolioCount').textContent = owned.length;
    }

    function loadActiveFeed() {
      const storageKey = currentAppMode === 'scout' ? 'thrift_scout_history' : 'thrift_owned_inventory';
      const items = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const container = document.getElementById('cardsFeed');

      if (items.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 24px;">No items logged in ${currentAppMode === 'scout' ? 'Scout' : 'Inventory'} mode.</div>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const sigColors = { GREEN: 'var(--green)', YELLOW: 'var(--yellow)', RED: 'var(--red)' };
        const sigLabels = { GREEN: 'SELL NOW', YELLOW: 'MONITOR', RED: 'KEEP' };
        const activeColor = sigColors[item.disposition.signal] || '#6b7280';
        const activeLabel = sigLabels[item.disposition.signal] || 'INFO';
        const sanitized = encodeURIComponent(item.searchQuery.replace(/[^a-zA-Z0-9\s]/g, ' ').trim());
        const compUrl = `https://www.ebay.com/sch/i.html?_nkw=${sanitized}&LH_Complete=1&LH_Sold=1`;

        return `
          <div class="vault-card" style="border-left: 5px solid ${activeColor};" onclick="openDetail(${item.id})">
            <div class="card-top">
              <div>
                <div class="card-title">${item.brand} - ${item.item}</div>
                <div class="card-sub">${item.specs}</div>
              </div>
              <span class="badge-signal" style="background: ${activeColor};">${activeLabel}</span>
            </div>
            <div class="card-val">$${Number(item.estimatedValue).toFixed(2)} <span>(${item.priceRange})</span></div>
            <div class="card-summary"><strong>Signal:</strong> ${item.disposition.reason}</div>
            <a href="${compUrl}" target="_blank" rel="noopener noreferrer" class="btn-comp" onclick="event.stopPropagation();">
              Live eBay Sold Comps ↗
            </a>
          </div>
        `;
      }).join('');
    }

    function openDetail(id) {
      const storageKey = currentAppMode === 'scout' ? 'thrift_scout_history' : 'thrift_owned_inventory';
      const items = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const target = items.find(i => i.id === id);
      if (!target) return;

      document.getElementById('modalImage').src = target.image;
      document.getElementById('modalContent').innerHTML = `
        <div class="modal-section">
          <strong>Identification</strong>
          ${target.brand} - ${target.item} (${target.specs})
        </div>
        <div class="modal-section">
          <strong>Valuation & Verdict</strong>
          $${Number(target.estimatedValue).toFixed(2)} [${target.priceRange}]<br>
          Verdict: ${target.verdict}
        </div>
        <div class="modal-section">
          <strong>Disposition Assessment</strong>
          Signal: ${target.disposition.signal}<br>
          Reason: ${target.disposition.reason}
        </div>
        <div class="modal-section">
          <strong>Platform & Shipping Protocol</strong>
          Target: ${target.routing.platform} (${target.routing.strategy})<br>
          Shipping: ${target.shipping.tier} | ${target.shipping.packaging} | ${target.shipping.service}
        </div>
        <div class="modal-section">
          <strong>Technical Intel & Authentication</strong>
          ${target.intel}
        </div>
      `;
      document.getElementById('detailModal').style.display = 'block';
    }

    function closeDetail() {
      document.getElementById('detailModal').style.display = 'none';
    }
  </script>
</body>
</html>
