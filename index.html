<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thrift Scout / Thrift-Vault</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181b21;
      --surface: #222630;
      --border: #2d3340;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --ebay: #0064d2;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      padding-bottom: 70px;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-title span {
      color: var(--green);
    }
    .btn-key {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      background: var(--panel);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .mode-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 8px 4px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .mode-btn.active {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .portfolio-banner {
      background: linear-gradient(135deg, #181b21 0%, #1f242d 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 10px;
    }
    .portfolio-metric {
      display: flex;
      flex-direction: column;
    }
    .portfolio-metric .label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .portfolio-metric .val {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--green);
    }
    .portfolio-metric .val.neutral {
      color: #fff;
    }
    .portfolio-metric .val.cost {
      color: var(--yellow);
    }
    .gesture-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: -6px;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }
    .action-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      user-select: none;
    }
    .btn-action.disabled {
      background: var(--surface);
      color: var(--text-muted);
      pointer-events: none;
      cursor: not-allowed;
    }
    input[type="file"] {
      display: none;
    }
    .status-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      border-left: 4px solid var(--accent);
      background: var(--panel);
      line-height: 1.4;
    }
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }
    .vault-card-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
    }
    .vault-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      position: relative;
      touch-action: pan-y;
      transition: transform 0.15s ease-out, background-color 0.15s;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }
    .card-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .badge-signal {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 4px;
      color: #000;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .calc-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin: 8px 0;
      text-align: center;
    }
    .calc-item {
      display: flex;
      flex-direction: column;
    }
    .calc-item span:first-child {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .calc-item span:last-child {
      font-size: 0.95rem;
      font-weight: 800;
    }
    .card-summary {
      font-size: 0.8rem;
      color: #d1d5db;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .btn-card {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-card.transfer {
      background: #1e3a8a;
      border-color: #2563eb;
      color: #fff;
    }
    .btn-card.sold {
      background: #064e3b;
      border-color: #059669;
      color: #fff;
    }
    .btn-card.delete {
      color: var(--red);
      background: transparent;
    }
    .btn-card.ebay {
      background: var(--ebay);
      color: #fff;
    }
    #detailModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      z-index: 100;
      overflow-y: auto;
      padding: 16px;
    }
    .modal-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .btn-back {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .modal-img {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .modal-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .modal-section strong {
      display: block;
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">THRIFT SCOUT <span>• VAULT</span></div>
    <button class="btn-key" onclick="promptApiKey()">API Key</button>
  </header>

  <div class="mode-toggle">
    <button id="modeScout" class="mode-btn active" onclick="switchMode('scout')">1. Scout Mode</button>
    <button id="modeOwned" class="mode-btn" onclick="switchMode('owned')">2. Inventory</button>
    <button id="modeSold" class="mode-btn" onclick="switchMode('sold')">3. Sold Archive</button>
  </div>

  <div class="portfolio-banner" id="bannerContainer"></div>
  <div class="gesture-hint">⇄ Swipe Right to Advance • Swipe Left to Discard</div>

  <div class="action-panel" id="actionPanel">
    <label class="btn-action" id="scanBtnLabel" for="cameraInput">
      📷 Scan Item Appraisal
    </label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processCapture(this)">
  </div>

  <div id="statusAlert" class="status-alert"></div>
  <div id="cardsFeed" class="feed-container"></div>

  <div id="detailModal">
    <div class="modal-nav">
      <button class="btn-back" onclick="closeDetail()">← Back</button>
      <button id="modalDeleteBtn" class="btn-card delete">Delete Item</button>
    </div>
    <img id="modalImage" class="modal-img" src="" alt="Asset Snapshot">
    <div id="modalContent"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAtDQnJuWvJOp__hVHO5fdNhjiRjZZkskI",
      authDomain: "thrift-scout-1b937.firebaseapp.com",
      projectId: "thrift-scout-1b937",
      storageBucket: "thrift-scout-1b937.firebasestorage.app",
      messagingSenderId: "559782240794",
      appId: "1:559782240794:web:5ace10f3f027b4cd82e7a3",
      measurementId: "G-4KFLG8XRQ8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const SYSTEM_PROMPT = `
You are Thrift-Vault AI secondary-market appraiser.
Output strictly in this format:

[ITEM_IDENTIFICATION]
Brand: <Brand>
Model/Item: <Model/Name>
Era/Size/Specs: <Specs>

[VALUATION_COMPS]
Sold Average: $<Number in USD>
Price Range: $<Low> - $<High>
Confidence: <High|Medium|Low>

[DISPOSITION_SIGNAL]
Signal: <GREEN|YELLOW|RED>
Reason: <1 short sentence>

[MARKETPLACE_ROUTING]
Primary Platform: <eBay|Mercari|Local>
Listing Strategy: <Price strategy>

[SHIPPING_PROTOCOL]
Tier: <Under 16 oz|1-5 lbs|5+ lbs / Oversized>
Packaging: <Packaging>
Recommended Service: <USPS Ground Advantage|UPS Ground>

[TECHNICAL_INTEL]
<Key tags, authentication markers, flaws>

[COMP_SEARCH_QUERY]
<Concise eBay sold search keywords>

[APPRAISAL_VERDICT]
<BUY TO FLIP|PASS|PERSONAL KEEP>
`;

    let currentAppMode = 'scout';
    let currentItems = [];
    let isProcessing = false;

    window.promptApiKey = function() {
      const stored = localStorage.getItem('thrift_gemini_key') || '';
      const input = prompt('Enter Google AI Studio Key (AQ...):', stored);
      if (input !== null) {
        localStorage.setItem('thrift_gemini_key', input.trim());
        triggerAlert('API Key saved.');
      }
    };

    window.switchMode = function(mode) {
      currentAppMode = mode;
      document.getElementById('modeScout').classList.toggle('active', mode === 'scout');
      document.getElementById('modeOwned').classList.toggle('active', mode === 'owned');
      document.getElementById('modeSold').classList.toggle('active', mode === 'sold');
      document.getElementById('actionPanel').style.display = mode === 'scout' ? 'flex' : 'none';
      listenToCollection();
    };

    function triggerAlert(msg, isError = false) {
      const box = document.getElementById('statusAlert');
      box.style.display = 'block';
      box.style.borderLeftColor = isError ? 'var(--red)' : 'var(--accent)';
      box.textContent = msg;
    }

    function dismissAlert() {
      document.getElementById('statusAlert').style.display = 'none';
    }

    function setScanButtonState(enabled, text = '📷 Scan Item Appraisal') {
      const label = document.getElementById('scanBtnLabel');
      const input = document.getElementById('cameraInput');
      if (enabled) {
        label.classList.remove('disabled');
        label.textContent = text;
        input.disabled = false;
        isProcessing = false;
      } else {
        label.classList.add('disabled');
        label.textContent = text;
        input.disabled = true;
        isProcessing = true;
      }
    }

    function startCooldown(seconds) {
      let count = seconds;
      setScanButtonState(false, `⏳ Ready in ${count}s...`);
      const timer = setInterval(() => {
        count--;
        if (count <= 0) {
          clearInterval(timer);
          setScanButtonState(true);
        } else {
          document.getElementById('scanBtnLabel').textContent = `⏳ Ready in ${count}s...`;
        }
      }, 1000);
    }

    function getEstimatedShippingCost(tier, buyerPaysShipping) {
      if (buyerPaysShipping) return 0.00;
      const lower = (tier || '').toLowerCase();
      if (lower.includes('under 16')) return 5.25;
      if (lower.includes('1-5')) return 9.75;
      if (lower.includes('5+') || lower.includes('oversized')) return 16.50;
      return 6.50;
    }

    function calculateNetProfit(grossPrice, costPrice, shippingCost) {
      const gross = Number(grossPrice) || 0;
      const cost = Number(costPrice) || 0;
      const ship = Number(shippingCost) || 0;
      if (gross <= 0) return 0;
      const ebayFee = (gross * 0.1325) + 0.40;
      return Number((gross - cost - ebayFee - ship).toFixed(2));
    }

    window.processCapture = async function(input) {
      if (isProcessing) return;
      const file = input.files[0];
      if (!file) return;

      const key = localStorage.getItem('thrift_gemini_key');
      if (!key) {
        alert('API Key missing. Please provide your Google AI Studio key.');
        window.promptApiKey();
        input.value = '';
        return;
      }

      setScanButtonState(false, '⚙️ Processing...');
      triggerAlert('Compressing capture (600px)...');
      const base64Data = await resizeCanvas(file, 600, 600);

      triggerAlert('Consulting valuation engine (Lite)...');
      await runAppraisal(base64Data, key);
      input.value = '';
    };

    function resizeCanvas(file, maxW, maxH) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxW) {
                h = Math.round((h * maxW) / w);
                w = maxW;
              }
            } else {
              if (h > maxH) {
                w = Math.round((w * maxH) / h);
                h = maxH;
              }
            }
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.60));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function runAppraisal(fullBase64, key) {
      const rawPayload = fullBase64.split(',')[1];
      const cleanKey = key.trim();
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${encodeURIComponent(cleanKey)}`;

      const body = {
        contents: [{
          parts: [
            { text: SYSTEM_PROMPT },
            { inline_data: { mime_type: 'image/jpeg', data: rawPayload } }
          ]
        }]
      };

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 18000);

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (response.status === 429) {
          throw new Error('Rate limit reached (429). Wait 15 seconds.');
        }

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const errMsg = errData.error?.message || response.statusText;
          throw new Error(`API error ${response.status}: ${errMsg}`);
        }

        const resData = await response.json();
        const text = resData.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error('Valuation engine returned an empty response.');

        dismissAlert();
        const appraisal = parseResponseData(text, fullBase64);
        await addDoc(collection(db, 'scout_prospects'), appraisal);
        startCooldown(3);

      } catch (err) {
        clearTimeout(timeoutId);
        if (err.name === 'AbortError') {
          triggerAlert('Upload timed out on weak cellular signal.', true);
        } else {
          triggerAlert(err.message, true);
        }
        startCooldown(3);
      }
    }

    function parseResponseData(rawText, imageUri) {
      const clean = rawText.replace(/[*#]/g, '');

      const extract = (sec) => {
        const pattern = new RegExp(`\\[${sec}\\]([\\s\\S]*?)(?=\\[[A-Z_]+\\]|$)`, 'i');
        const match = clean.match(pattern);
        return match ? match[1].trim() : 'N/A';
      };

      const idBlock = extract('ITEM_IDENTIFICATION');
      const valBlock = extract('VALUATION_COMPS');
      const dispBlock = extract('DISPOSITION_SIGNAL');
      const routeBlock = extract('MARKETPLACE_ROUTING');
      const shipBlock = extract('SHIPPING_PROTOCOL');
      const intelBlock = extract('TECHNICAL_INTEL');
      const queryBlock = extract('COMP_SEARCH_QUERY');
      const verdictBlock = extract('APPRAISAL_VERDICT');

      const getVal = (block, key) => {
        const match = block.match(new RegExp(`${key}:\\s*(.+)`, 'i'));
        return match ? match[1].trim() : null;
      };

      const sigMatch = dispBlock.match(/Signal:\s*(GREEN|YELLOW|RED)/i);
      const signal = sigMatch ? sigMatch[1].toUpperCase() : 'YELLOW';

      const avgMatch = valBlock.match(/Sold Average:\s*\$?([\d,]+(\.\d{2})?)/i);
      const estValue = avgMatch ? parseFloat(avgMatch[1].replace(/,/g, '')) : 0.00;

      const brand = getVal(idBlock, 'Brand') || 'Unknown Brand';
      const item = getVal(idBlock, 'Model/Item') || 'Item';
      const shipTier = getVal(shipBlock, 'Tier') || 'Standard Parcel';

      const estShip = getEstimatedShippingCost(shipTier, false);
      const initialNet = calculateNetProfit(estValue, 0, estShip);

      return {
        image: imageUri,
        brand: brand,
        item: item,
        specs: getVal(idBlock, 'Era/Size/Specs') || 'N/A',
        estimatedValue: estValue,
        priceRange: getVal(valBlock, 'Price Range') || '$0 - $0',
        confidence: getVal(valBlock, 'Confidence') || 'Medium',
        itemCost: 0.00,
        buyerPaysShipping: false,
        estimatedShippingOutlay: estShip,
        projectedProfit: initialNet,
        disposition: {
          signal: signal,
          reason: getVal(dispBlock, 'Reason') || 'No rationale available.'
        },
        routing: {
          platform: getVal(routeBlock, 'Primary Platform') || 'eBay',
          strategy: getVal(routeBlock, 'Listing Strategy') || 'Standard fixed-price'
        },
        shipping: {
          tier: shipTier,
          packaging: getVal(shipBlock, 'Packaging') || 'Boxed',
          service: getVal(shipBlock, 'Recommended Service') || 'USPS Ground Advantage'
        },
        intel: intelBlock,
        searchQuery: queryBlock !== 'N/A' ? queryBlock : `${brand} ${item}`,
        verdict: verdictBlock,
        status: 'prospect',
        createdAt: Date.now()
      };
    }

    // Transfers to inventory with clean empty input prompt
    window.transferToInventory = async function(id, event) {
      if (event) event.stopPropagation();
      const target = currentItems.find(i => i.id === id);
      if (!target) return;

      const costInput = prompt(`Purchase cost for "${target.brand} - ${target.item}":\n(Type amount only, e.g. 4.50)`, '');
      if (costInput === null) return;
      const cost = parseFloat(costInput.replace(/[^0-9.]/g, '')) || 0.00;

      const buyerPays = confirm('Does the BUYER pay shipping?\n\nOK = Buyer Pays ($0 shipping outlay for you)\nCancel = Free Shipping (You pay estimated shipping)');
      const shipOutlay = getEstimatedShippingCost(target.shipping.tier, buyerPays);
      const netProfit = calculateNetProfit(target.estimatedValue, cost, shipOutlay);

      const inventoryItem = {
        ...target,
        itemCost: cost,
        buyerPaysShipping: buyerPays,
        estimatedShippingOutlay: shipOutlay,
        projectedProfit: netProfit,
        status: 'owned',
        purchasedAt: Date.now()
      };
      delete inventoryItem.id;

      await addDoc(collection(db, 'vault_inventory'), inventoryItem);
      await deleteDoc(doc(db, 'scout_prospects', target.id));
      triggerAlert(`Added "${target.item}" to Inventory.`);
    };

    // Marks as sold with clean empty input prompt
    window.markAsSold = async function(id, event) {
      if (event) event.stopPropagation();
      const target = currentItems.find(i => i.id === id);
      if (!target) return;

      const soldPriceInput = prompt(`Final SOLD price for "${target.item}":\n(Type amount only, e.g. 45)`, '');
      if (soldPriceInput === null) return;
      const soldPrice = parseFloat(soldPriceInput.replace(/[^0-9.]/g, '')) || target.estimatedValue;

      const actualShipInput = prompt('Actual shipping cost paid by YOU:\n($0 if buyer paid)', target.buyerPaysShipping ? '0' : '');
      if (actualShipInput === null) return;
      const actualShip = parseFloat(actualShipInput.replace(/[^0-9.]/g, '')) || 0.00;

      const realizedProfit = calculateNetProfit(soldPrice, target.itemCost, actualShip);

      const soldItem = {
        ...target,
        finalSoldPrice: soldPrice,
        actualShippingPaid: actualShip,
        realizedProfit: realizedProfit,
        status: 'sold',
        soldAt: Date.now()
      };
      delete soldItem.id;

      await addDoc(collection(db, 'vault_sold'), soldItem);
      await deleteDoc(doc(db, 'vault_inventory', target.id));
      triggerAlert(`Sold "${target.item}" (+$${realizedProfit.toFixed(2)} Profit).`);
    };

    window.deleteItem = async function(id, event) {
      if (event) event.stopPropagation();
      const target = currentItems.find(i => i.id === id);
      const name = target ? target.item : 'item';
      const confirmed = confirm(`Permanently discard "${name}"?`);
      if (!confirmed) return;

      const collName = currentAppMode === 'scout' ? 'scout_prospects' : (currentAppMode === 'owned' ? 'vault_inventory' : 'vault_sold');
      await deleteDoc(doc(db, collName, id));
      window.closeDetail();
    };

    // Native touch swipe listener engine
    function setupSwipeGestures() {
      const cards = document.querySelectorAll('.vault-card');
      cards.forEach(card => {
        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let isSwiping = false;

        card.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          isSwiping = true;
          card.style.transition = 'none';
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
          if (!isSwiping) return;
          const touchX = e.touches[0].clientX;
          const touchY = e.touches[0].clientY;
          const diffX = touchX - startX;
          const diffY = touchY - startY;

          // Ignore horizontal gesture if vertical scrolling is prominent
          if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffX) < 15) {
            isSwiping = false;
            return;
          }

          currentX = diffX;
          card.style.transform = `translateX(${currentX}px)`;

          if (currentX > 30) {
            card.style.backgroundColor = '#064e3b'; // Green cue for Advance
          } else if (currentX < -30) {
            card.style.backgroundColor = '#450a0a'; // Red cue for Discard
          } else {
            card.style.backgroundColor = 'var(--panel)';
          }
        }, { passive: true });

        card.addEventListener('touchend', () => {
          if (!isSwiping) return;
          isSwiping = false;
          card.style.transition = 'transform 0.2s ease, background-color 0.2s';
          card.style.backgroundColor = 'var(--panel)';

          const id = card.dataset.id;
          if (currentX > 75) {
            // Swiped Right -> Advance
            card.style.transform = 'translateX(100%)';
            setTimeout(() => {
              if (currentAppMode === 'scout') {
                window.transferToInventory(id);
              } else if (currentAppMode === 'owned') {
                window.markAsSold(id);
              }
              card.style.transform = 'translateX(0px)';
            }, 180);
          } else if (currentX < -75) {
            // Swiped Left -> Discard
            card.style.transform = 'translateX(-100%)';
            setTimeout(() => {
              window.deleteItem(id);
              card.style.transform = 'translateX(0px)';
            }, 180);
          } else {
            // Return to rest
            card.style.transform = 'translateX(0px)';
          }
          currentX = 0;
        });
      });
    }

    let unsubscribeSnapshot = null;

    function listenToCollection() {
      if (unsubscribeSnapshot) unsubscribeSnapshot();

      const collName = currentAppMode === 'scout' ? 'scout_prospects' : (currentAppMode === 'owned' ? 'vault_inventory' : 'vault_sold');
      const sortField = currentAppMode === 'sold' ? 'soldAt' : (currentAppMode === 'owned' ? 'purchasedAt' : 'createdAt');
      const q = query(collection(db, collName), orderBy(sortField, 'desc'));

      unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
        currentItems = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderMetrics();
        renderFeed();
        setupSwipeGestures();
      });
    }

    function renderMetrics() {
      const container = document.getElementById('bannerContainer');

      if (currentAppMode === 'scout') {
        const potentialProfit = currentItems.reduce((acc, i) => acc + (Number(i.projectedProfit) || 0), 0);
        container.innerHTML = `
          <div class="portfolio-metric">
            <span class="label">Potential Flip Profit</span>
            <span class="val">$${potentialProfit.toFixed(2)}</span>
          </div>
          <div class="portfolio-metric" style="align-items: flex-end;">
            <span class="label">Prospects Triaged</span>
            <span class="val neutral">${currentItems.length}</span>
          </div>
        `;
      } else if (currentAppMode === 'owned') {
        const totalInvested = currentItems.reduce((acc, i) => acc + (Number(i.itemCost) || 0), 0);
        const projectedNet = currentItems.reduce((acc, i) => acc + (Number(i.projectedProfit) || 0), 0);
        const grossValue = currentItems.reduce((acc, i) => acc + (Number(i.estimatedValue) || 0), 0);

        container.innerHTML = `
          <div class="portfolio-metric">
            <span class="label">Total Cost Basis</span>
            <span class="val cost">$${totalInvested.toFixed(2)}</span>
          </div>
          <div class="portfolio-metric">
            <span class="label">Projected Net Profit</span>
            <span class="val">$${projectedNet.toFixed(2)}</span>
          </div>
          <div class="portfolio-metric">
            <span class="label">Gross Comps Value</span>
            <span class="val neutral">$${grossValue.toFixed(2)}</span>
          </div>
          <div class="portfolio-metric" style="align-items: flex-end;">
            <span class="label">Active Items</span>
            <span class="val neutral">${currentItems.length}</span>
          </div>
        `;
      } else if (currentAppMode === 'sold') {
        const totalRealizedProfit = currentItems.reduce((acc, i) => acc + (Number(i.realizedProfit) || 0), 0);
        const totalRevenue = currentItems.reduce((acc, i) => acc + (Number(i.finalSoldPrice) || 0), 0);
        const totalOriginalCost = currentItems.reduce((acc, i) => acc + (Number(i.itemCost) || 0), 0);

        container.innerHTML = `
          <div class="portfolio-metric">
            <span class="label">Realized Net Profit</span>
            <span class="val">$${totalRealizedProfit.toFixed(2)}</span>
          </div>
          <div class="portfolio-metric">
            <span class="label">Total Revenue</span>
            <span class="val neutral">$${totalRevenue.toFixed(2)}</span>
          </div>
          <div class="portfolio-metric">
            <span class="label">Original Cost</span>
            <span class="val cost">$${totalOriginalCost.toFixed(2)}</span>
          </div>
          <div class="portfolio-metric" style="align-items: flex-end;">
            <span class="label">Units Flipped</span>
            <span class="val neutral">${currentItems.length}</span>
          </div>
        `;
      }
    }

    function renderFeed() {
      const container = document.getElementById('cardsFeed');
      if (currentItems.length === 0) {
        const labels = {
          scout: 'No prospects scanned. Ready for field triage.',
          owned: 'Inventory is empty. Swipe right on Scout items to purchase.',
          sold: 'No sold records logged yet.'
        };
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 24px;">${labels[currentAppMode]}</div>`;
        return;
      }

      container.innerHTML = currentItems.map(item => {
        const sigColors = { GREEN: 'var(--green)', YELLOW: 'var(--yellow)', RED: 'var(--red)' };
        const sigLabels = { GREEN: 'STRONG BUY', YELLOW: 'MARGINAL', RED: 'PASS' };
        const activeColor = sigColors[item.disposition.signal] || '#6b7280';
        const activeLabel = sigLabels[item.disposition.signal] || 'INFO';
        const sanitized = encodeURIComponent(item.searchQuery.replace(/[^a-zA-Z0-9\s]/g, ' ').trim());
        const compUrl = `https://www.ebay.com/sch/i.html?_nkw=${sanitized}&LH_Complete=1&LH_Sold=1`;

        if (currentAppMode === 'scout') {
          return `
            <div class="vault-card-wrapper">
              <div class="vault-card" data-id="${item.id}" style="border-left: 5px solid ${activeColor};" onclick="openDetail('${item.id}')">
                <div class="card-top">
                  <div>
                    <div class="card-title">${item.brand} - ${item.item}</div>
                    <div class="card-sub">${item.specs}</div>
                  </div>
                  <span class="badge-signal" style="background: ${activeColor};">${activeLabel}</span>
                </div>
                <div class="calc-row">
                  <div class="calc-item">
                    <span>Sold Comp</span>
                    <span style="color: #fff;">$${Number(item.estimatedValue).toFixed(2)}</span>
                  </div>
                  <div class="calc-item">
                    <span>Ship Est.</span>
                    <span style="color: var(--text-muted);">$${Number(item.estimatedShippingOutlay).toFixed(2)}</span>
                  </div>
                  <div class="calc-item">
                    <span>Est. Net Profit</span>
                    <span style="color: var(--green);">$${Number(item.projectedProfit).toFixed(2)}</span>
                  </div>
                </div>
                <div class="card-summary"><strong>Signal Rationale:</strong> ${item.disposition.reason}</div>
                <div class="card-actions">
                  <button class="btn-card transfer" onclick="transferToInventory('${item.id}', event)">📥 Buy & Move</button>
                  <a href="${compUrl}" target="_blank" rel="noopener noreferrer" class="btn-card ebay" onclick="event.stopPropagation();">eBay Sold Comps ↗</a>
                  <button class="btn-card delete" onclick="deleteItem('${item.id}', event)">Discard</button>
                </div>
              </div>
            </div>
          `;
        } else if (currentAppMode === 'owned') {
          return `
            <div class="vault-card-wrapper">
              <div class="vault-card" data-id="${item.id}" style="border-left: 5px solid var(--accent);" onclick="openDetail('${item.id}')">
                <div class="card-top">
                  <div>
                    <div class="card-title">${item.brand} - ${item.item}</div>
                    <div class="card-sub">${item.specs}</div>
                  </div>
                  <span class="badge-signal" style="background: var(--accent); color: #fff;">IN STOCK</span>
                </div>
                <div class="calc-row">
                  <div class="calc-item">
                    <span>Purchase Cost</span>
                    <span style="color: var(--yellow);">$${Number(item.itemCost).toFixed(2)}</span>
                  </div>
                  <div class="calc-item">
                    <span>Target Gross</span>
                    <span style="color: #fff;">$${Number(item.estimatedValue).toFixed(2)}</span>
                  </div>
                  <div class="calc-item">
                    <span>Projected Net</span>
                    <span style="color: var(--green);">$${Number(item.projectedProfit).toFixed(2)}</span>
                  </div>
                </div>
                <div class="card-actions">
                  <button class="btn-card sold" onclick="markAsSold('${item.id}', event)">💰 Mark as Sold</button>
                  <a href="${compUrl}" target="_blank" rel="noopener noreferrer" class="btn-card ebay" onclick="event.stopPropagation();">Live Comps ↗</a>
                  <button class="btn-card delete" onclick="deleteItem('${item.id}', event)">Remove</button>
                </div>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="vault-card-wrapper">
              <div class="vault-card" data-id="${item.id}" style="border-left: 5px solid var(--green);" onclick="openDetail('${item.id}')">
                <div class="card-top">
                  <div>
                    <div class="card-title">${item.brand} - ${item.item}</div>
                    <div class="card-sub">Sold on: ${new Date(item.soldAt).toLocaleDateString()}</div>
                  </div>
                  <span class="badge-signal" style="background: var(--green); color: #000;">COMPLETED</span>
                </div>
                <div class="calc-row">
                  <div class="calc-item">
                    <span>Cost Basis</span>
                    <span style="color: var(--yellow);">$${Number(item.itemCost).toFixed(2)}</span>
                  </div>
                  <div class="calc-item">
                    <span>Sold Price</span>
                    <span style="color: #fff;">$${Number(item.finalSoldPrice).toFixed(2)}</span>
                  </div>
                  <div class="calc-item">
                    <span>Realized Profit</span>
                    <span style="color: var(--green);">$${Number(item.realizedProfit).toFixed(2)}</span>
                  </div>
                </div>
                <div class="card-actions">
                  <a href="${compUrl}" target="_blank" rel="noopener noreferrer" class="btn-card ebay" onclick="event.stopPropagation();">Comps ↗</a>
                  <button class="btn-card delete" onclick="deleteItem('${item.id}', event)">Purge</button>
                </div>
              </div>
            </div>
          `;
        }
      }).join('');
    }

    window.openDetail = function(id) {
      const target = currentItems.find(i => i.id === id);
      if (!target) return;

      document.getElementById('modalImage').src = target.image;
      document.getElementById('modalDeleteBtn').onclick = () => window.deleteItem(target.id);

      const sanitized = encodeURIComponent(target.searchQuery.replace(/[^a-zA-Z0-9\s]/g, ' ').trim());
      const compUrl = `https://www.ebay.com/sch/i.html?_nkw=${sanitized}&LH_Complete=1&LH_Sold=1`;

      document.getElementById('modalContent').innerHTML = `
        <div class="modal-section">
          <strong>Item Identification</strong>
          ${target.brand} - ${target.item}<br>
          <span style="color: var(--text-muted);">${target.specs}</span>
        </div>
        <div class="modal-section">
          <strong>Valuation & Comps</strong>
          Sold Average: <span style="font-weight: 700; color: var(--green);">$${Number(target.estimatedValue).toFixed(2)}</span> (${target.priceRange})<br>
          Model Confidence: ${target.confidence}<br>
          Appraisal Verdict: <strong>${target.verdict}</strong>
        </div>
        <div class="modal-section">
          <strong>Financial Breakdown</strong>
          Item Cost: $${Number(target.itemCost).toFixed(2)}<br>
          Estimated Shipping Outlay: $${Number(target.estimatedShippingOutlay).toFixed(2)} (${target.buyerPaysShipping ? 'Buyer Pays' : 'Free Shipping'})<br>
          Est. eBay Fee (13.25% + $0.40): $${((target.estimatedValue * 0.1325) + 0.40).toFixed(2)}<br>
          Net Take-Home: <strong>$${Number(target.projectedProfit).toFixed(2)}</strong>
        </div>
        <div class="modal-section">
          <strong>Marketplace Routing & Logistics</strong>
          Platform: ${target.routing.platform}<br>
          Listing Strategy: ${target.routing.strategy}<br>
          Shipping Tier: ${target.shipping.tier}<br>
          Packaging: ${target.shipping.packaging}<br>
          Service: ${target.shipping.service}
        </div>
        <div class="modal-section">
          <strong>Technical Intel & Hardware Specs</strong>
          ${target.intel}
        </div>
        <div style="margin-top: 14px;">
          <a href="${compUrl}" target="_blank" rel="noopener noreferrer" class="btn-card ebay" style="width: 100%; justify-content: center; padding: 12px;">
            Open Live eBay Sold Comps ↗
          </a>
        </div>
      `;
      document.getElementById('detailModal').style.display = 'block';
    };

    window.closeDetail = function() {
      document.getElementById('detailModal').style.display = 'none';
    };

    async function seedInitialDatabaseIfEmpty() {

      if (seededFlag) return;

      try {
        const scoutSnap = await getDocs(collection(db, 'scout_prospects'));
        const ownedSnap = await getDocs(collection(db, 'vault_inventory'));
        const soldSnap = await getDocs(collection(db, 'vault_sold'));

          const placeholderImg = "data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22400%22%20height%3D%22300%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23222630%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20fill%3D%22%239ca3af%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20font-size%3D%2216%22%3EAsset%20Snapshot%3C%2Ftext%3E%3C%2Fsvg%3E";

            searchQuery: 'Griswold 8 Cast Iron Skillet 704',
            verdict: 'BUY TO FLIP',

    }

    (async () => {
      await seedInitialDatabaseIfEmpty();
      listenToCollection();
    })();
  </script>
