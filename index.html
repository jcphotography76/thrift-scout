<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thrift Scout AI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 16px; }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 16px; color: #4ade80; }
    .box { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    input[type="password"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
    .btn { display: block; width: 100%; padding: 14px; background: #10b981; color: #000; font-weight: bold; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; text-align: center; box-sizing: border-box; }
    .btn:disabled { background: #555; color: #888; }
    input[type="file"] { display: none; }
    #preview { width: 100%; border-radius: 8px; margin-top: 12px; display: none; }
    #results { display: none; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; }
    .loading { text-align: center; color: #fbbf24; font-weight: bold; display: none; }
  </style>
</head>
<body>
  <h1>Thrift Scout AI</h1>

  <div class="box">
    <label for="apiKey">Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Paste your API key here">
  </div>

  <div class="box">
    <label class="btn" for="cameraInput">Take Photo or Upload</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <img id="preview" alt="Scan preview">
    <div id="loading" class="loading" style="margin-top:12px;">Analyzing item & market comps...</div>
  </div>

  <div id="resultsBox" class="box" style="display:none;">
    <label>Evaluation & Market Analysis</label>
    <div id="results"></div>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const resultsBox = document.getElementById('resultsBox');
    const resultsDiv = document.getElementById('results');
    const loadingDiv = document.getElementById('loading');

    // Auto-load saved key
    apiKeyInput.value = localStorage.getItem('thrift_gemini_key') || '';
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('thrift_gemini_key', apiKeyInput.value.trim());
    });

    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const key = apiKeyInput.value.trim();
      if (!key) {
        alert('Please paste your Gemini API key first.');
        return;
      }

      // Show preview
      const reader = new FileReader();
      reader.onload = async (event) => {
        preview.src = event.target.result;
        preview.style.display = 'block';
        resultsBox.style.display = 'none';
        loadingDiv.style.display = 'block';

        const base64Data = event.target.result.split(',')[1];
        await analyzeItem(key, base64Data, file.type);
      };
      reader.readAsDataURL(file);
    });

    async function analyzeItem(key, base64Data, mimeType) {
      const prompt = `You are an expert resale appraiser and vintage goods authenticator.
Analyze this item photo (item, tags, label, or build) and return a structured breakdown:

1. IDENTIFICATION: Brand/Maker, item name, model/style, estimated era/decade.
2. EDUCATIONAL INTEL: Key identifiers shown (e.g. stitching style, tag layout, materials, hallmarks, country of origin). Explain what makes this brand or piece notable, collectable, or common.
3. ESTIMATED RESALE VALUE: Realistic secondary market sold range (eBay/Mercari completed comps). Give:
   - Low Range (Quick flip / minor flaws)
   - Realistic Average (Standard sold comp)
   - Ceiling / High (Pristine / top demand)
4. VERDICT: "BUY TO FLIP", "PASS", or "PERSONAL KEEP" with a 1-sentence reasoning based on resale margin.

Keep the response direct, factual, and concise.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: mimeType, data: base64Data } }
              ]
            }]
          })
        });

        const data = await response.json();
        loadingDiv.style.display = 'none';

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          resultsDiv.textContent = data.candidates[0].content.parts[0].text;
          resultsBox.style.display = 'block';
          resultsDiv.style.display = 'block';
        } else {
          resultsDiv.textContent = 'Error: Could not evaluate image. ' + JSON.stringify(data);
          resultsBox.style.display = 'block';
          resultsDiv.style.display = 'block';
        }
      } catch (err) {
        loadingDiv.style.display = 'none';
        resultsDiv.textContent = 'Connection error: ' + err.message;
        resultsBox.style.display = 'block';
        resultsDiv.style.display = 'block';
      }
    }
  </script>
</body>
</html>
