<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thrift Scout AI</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 16px; padding-bottom: 40px; }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 16px; color: #4ade80; }
    .box { background: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
    .btn { display: block; width: 100%; padding: 14px; background: #10b981; color: #000; font-weight: bold; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; text-align: center; box-sizing: border-box; }
    input[type="file"] { display: none; }
    #preview { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-top: 12px; display: none; }
    #results { display: none; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; }
    .loading { text-align: center; color: #fbbf24; font-weight: bold; display: none; }
    
    /* Gallery Styles */
    .gallery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .clear-btn { background: #ef4444; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
    .history-card { background: #252525; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; gap: 12px; }
    .history-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .history-info { font-size: 0.85rem; line-height: 1.4; overflow: hidden; }
    .history-title { font-weight: bold; color: #4ade80; margin-bottom: 4px; }
    .history-value { color: #fbbf24; font-weight: bold; }
    .history-date { font-size: 0.7rem; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Thrift Scout AI</h1>

  <div class="box">
    <label class="btn" for="cameraInput">Take Photo or Upload</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <img id="preview" alt="Scan preview">
    <div id="loading" class="loading" style="margin-top:12px;">Compressing & analyzing market comps...</div>
  </div>

  <div id="resultsBox" class="box" style="display:none;">
    <label>Current Scan Analysis</label>
    <div id="results"></div>
  </div>

  <div class="box">
    <div class="gallery-header">
      <label style="margin:0; font-size:1rem; color:#fff;">Previously Scanned Items</label>
      <button class="clear-btn" id="clearBtn">Clear All</button>
    </div>
    <div id="historyList"></div>
  </div>

  <script>
    // HARDCODED PERSONAL KEY - Replace with your actual key
    const GEMINI_API_KEY = "PASTE_YOUR_ACTUAL_KEY_HERE";

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const resultsBox = document.getElementById('resultsBox');
    const resultsDiv = document.getElementById('results');
    const loadingDiv = document.getElementById('loading');
    const historyList = document.getElementById('historyList');
    const clearBtn = document.getElementById('clearBtn');

    // Load history on startup
    renderHistory();

    clearBtn.addEventListener('click', () => {
      if (confirm('Clear scan history?')) {
        localStorage.removeItem('thrift_scout_history');
        renderHistory();
      }
    });

    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      loadingDiv.style.display = 'block';
      resultsBox.style.display = 'none';

      // 1. Instant Client-Side Image Compression for Speed
      const compressedDataUrl = await resizeImage(file, 1000);
      preview.src = compressedDataUrl;
      preview.style.display = 'block';

      const base64Data = compressedDataUrl.split(',')[1];
      await analyzeItem(GEMINI_API_KEY, base64Data, 'image/jpeg', compressedDataUrl);
    });

    function resizeImage(file, maxDimension) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (readerEvent) => {
          const image = new Image();
          image.onload = () => {
            let width = image.width;
            let height = image.height;

            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(image, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          image.src = readerEvent.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function analyzeItem(key, base64Data, mimeType, thumbnailSrc) {
      const prompt = `You are a real-world secondary market appraisal assistant.
Identify the item, manufacturer tag, or physical markings. Strictly state "UNKNOWN" if details are illegible—do not invent model names.

Format strictly as:
TITLE: [Brand, Model/Era, Primary Material]
VALUATION: [Realistic Sold Comp Range: e.g. $15 - $25 Avg]
INTEL: [Single stitch, RN number, tag indicators, or why this item is desirable/undesirable]
VERDICT: [BUY TO FLIP / PASS / PERSONAL KEEP] - [1-sentence reason]`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: mimeType, data: base64Data } }
              ]
            }],
            generationConfig: {
              maxOutputTokens: 350,
              temperature: 0.2
            }
          })
        });

        const data = await response.json();
        loadingDiv.style.display = 'none';

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const rawText = data.candidates[0].content.parts[0].text;
          resultsDiv.textContent = rawText;
          resultsBox.style.display = 'block';
          resultsDiv.style.display = 'block';

          // Save to local scan history
          saveToHistory(thumbnailSrc, rawText);
        } else {
          resultsDiv.textContent = 'Error: ' + JSON.stringify(data);
          resultsBox.style.display = 'block';
          resultsDiv.style.display = 'block';
        }
      } catch (err) {
        loadingDiv.style.display = 'none';
        resultsDiv.textContent = 'Connection error: ' + err.message;
        resultsBox.style.display = 'block';
        resultsDiv.style.display = 'block';
      }
    }

    function saveToHistory(imageSrc, text) {
      const history = JSON.parse(localStorage.getItem('thrift_scout_history') || '[]');
      history.unshift({
        id: Date.now(),
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        image: imageSrc,
        text: text
      });
      // Keep most recent 25 scans
      if (history.length > 25) history.pop();
      localStorage.setItem('thrift_scout_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('thrift_scout_history') || '[]');
      if (history.length === 0) {
        historyList.innerHTML = '<div style="color:#666; font-size:0.85rem;">No recent scans yet.</div>';
        return;
      }

      historyList.innerHTML = history.map(item => `
        <div class="history-card">
          <img src="${item.image}" alt="Thumbnail">
          <div class="history-info">
            <div class="history-date">${item.date}</div>
            <div style="white-space: pre-wrap; font-size: 0.8rem; margin-top:4px;">${item.text}</div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
