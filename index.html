<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thrift Scout • Field Recon</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #0d1117;
      --border: #21262d;
      --border-focus: #388bfd;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.15);
      --amber: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.15);
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.15);
      --blue: #2563eb;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-stack);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(75px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em; }
    .brand-accent { color: var(--emerald); }
    .header-pills { display: flex; gap: 8px; align-items: center; }
    .scan-pill {
      background: var(--emerald-glow);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .settings-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    main { flex: 1; width: 100%; max-width: 650px; margin: 0 auto; padding: 16px; }
    .tab-view { display: none; flex-direction: column; gap: 14px; }
    .tab-view.active { display: flex; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-title { font-size: 0.95rem; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
    .status-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      border-left: 4px solid var(--blue);
      background: var(--card-bg);
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      user-select: none;
    }
    .btn-emerald { background: var(--emerald); color: #000; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .camera-row { display: grid; grid-template-columns: 1fr; gap: 8px; }

    .cost-input-wrapper { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .cost-explanation-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .cost-input-container { position: relative; display: flex; align-items: center; }
    .currency-symbol { position: absolute; left: 12px; font-size: 0.95rem; font-weight: 800; color: var(--emerald); pointer-events: none; }
    .cost-input-field {
      width: 100%; background: #000; border: 1px solid var(--border); border-radius: 8px;
      padding: 12px 12px 12px 28px; color: var(--text); font-size: 0.95rem; font-weight: 700; font-family: inherit; outline: none;
    }
    .cost-input-field:focus { border-color: var(--border-focus); }

    .eval-action-wrapper { display: flex; flex-direction: column; justify-content: flex-end; flex: 1.2; }

    .metric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .metric-box {
      background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px;
    }
    .metric-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .metric-val { font-size: 1.15rem; font-weight: 800; }
    .metric-val.profit { color: var(--emerald); }
    .disposition-pill { padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; }
    .disp-flip { background: var(--emerald-glow); color: var(--emerald); border: 1px solid var(--emerald); }
    .disp-monitor { background: var(--amber-glow); color: var(--amber); border: 1px solid var(--amber); }
    .disp-pass { background: var(--red-glow); color: var(--red); border: 1px solid var(--red); }
    
    .vault-summary { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .vault-list { display: flex; flex-direction: column; gap: 10px; }
    .vault-item { display: flex; gap: 12px; background: #05070a; border: 1px solid var(--border); border-radius: 10px; padding: 12px; align-items: flex-start; }
    .item-thumb { width: 78px; height: 78px; min-width: 78px; border-radius: 6px; object-fit: cover; background: #161b22; border: 1px solid var(--border); }
    .item-content { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .item-title { font-weight: 700; font-size: 0.92rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: 0.78rem; color: var(--text-muted); }
    .item-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

    .bottom-dock {
      position: fixed; bottom: 0; left: 0; right: 0; height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom); background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .dock-btn { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.75rem; font-weight: 700; }
    .dock-btn.active { color: var(--emerald); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 200; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; max-width: 480px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .input-field { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 0.9rem; font-family: inherit; outline: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>THRIFT</span><span class="brand-accent">SCOUT</span>
    </div>
    <div class="header-pills">
      <div class="scan-pill" id="scanPill">100 SCANS</div>
      <button class="settings-btn" id="configBtn">Config</button>
    </div>
  </header>

  <main>
    <div id="statusAlert" class="status-alert"></div>

    <!-- TAB 1: SCOUT -->
    <section id="tab-scout" class="tab-view active">
      <div class="card">
        <div class="card-title">RAPID THRIFT RECON</div>
        
        <input type="file" id="mobileCameraInput" accept="image/*" capture="environment" style="display:none;">

        <div class="camera-row">
          <button class="btn btn-emerald" id="snapMobileBtn">📸 SNAP PHOTO (TURBO)</button>
        </div>

        <div id="imagePreviewContainer" style="display:none; text-align:center;">
          <img id="previewImg" style="max-height:180px; border-radius:8px; border:1px solid var(--border);" alt="Preview">
        </div>

        <div style="display:flex; gap:10px; align-items:flex-end; margin-top: 8px;">
          <div class="cost-input-wrapper">
            <label class="cost-explanation-label">Thrift Store Tag Price</label>
            <div class="cost-input-container">
              <span class="currency-symbol">$</span>
              <input type="number" id="purchaseCost" class="cost-input-field" placeholder="0.00" value="2.99" step="0.50">
            </div>
          </div>
          <div class="eval-action-wrapper">
            <button class="btn btn-emerald" id="evaluateBtn">⚡ EVALUATE</button>
          </div>
        </div>
      </div>

      <div class="card" id="appraisalCard" style="display:none;">
        <div class="card-title">
          <span id="resItemTitle">Identified Item</span>
          <span id="resDispPill" class="disposition-pill disp-flip">FLIP</span>
        </div>
        <div class="metric-grid">
          <div class="metric-box">
            <span class="metric-label">Estimated Resale</span>
            <span class="metric-val" id="resEstResale">$0.00</span>
          </div>
          <div class="metric-box">
            <span class="metric-label">Net Profit (Est)</span>
            <span class="metric-val profit" id="resEstProfit">$0.00</span>
          </div>
          <div class="metric-box">
            <span class="metric-label">Brand / Title</span>
            <span class="metric-val" id="resBrand" style="font-size:0.95rem;">--</span>
          </div>
          <div class="metric-box">
            <span class="metric-label">Platform</span>
            <span class="metric-val" id="resPlatform" style="font-size:0.85rem;">eBay</span>
          </div>
        </div>
        <div style="font-size:0.85rem; color:var(--text); line-height:1.4; background:#000; padding:10px; border-radius:6px; border:1px solid var(--border);" id="resIntel"></div>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <a id="resEbayLink" target="_blank" class="btn btn-outline" style="flex:1; font-size:0.8rem;">VIEW SOLD COMPS</a>
          <button class="btn btn-emerald" id="saveVaultBtn" style="flex:1; font-size:0.8rem;">SEND TO VAULT</button>
        </div>
      </div>
    </section>

    <!-- TAB 2: VAULT -->
    <section id="tab-vault" class="tab-view">
      <div class="card">
        <div class="vault-summary">
          <div>
            <div class="metric-label">Cloud Vault Portfolio</div>
            <div class="metric-val profit" id="vaultTotal">$0.00</div>
          </div>
          <div style="text-align:right;">
            <div class="metric-label">Saved Items</div>
            <div class="metric-val" id="vaultCount">0 items</div>
          </div>
        </div>
        <div class="vault-list" id="vaultItemList"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-dock">
    <button class="dock-btn active" data-target="tab-scout">SCOUT</button>
    <button class="dock-btn" data-target="tab-vault">VAULT</button>
  </nav>

  <!-- CONFIG MODAL -->
  <div class="modal-overlay" id="configModal">
    <div class="modal-content">
      <div class="card-title">System Settings</div>
      <div>
        <label class="metric-label">Gemini API Key</label>
        <input type="password" id="geminiApiKey" class="input-field" placeholder="AIzaSy..." style="margin-top:4px;">
      </div>
      <div>
        <label class="metric-label">Quota Reset</label>
        <button class="btn btn-outline" style="margin-top:4px; padding:8px;" onclick="resetQuota()">Reset Daily Quota (100)</button>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-outline" id="closeConfigBtn" style="flex:1;">Cancel</button>
        <button class="btn btn-emerald" id="saveConfigBtn" style="flex:1;">Save</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAtDQnJuWvJOp__hVHO5fdNhjiRjZZkskI",
      authDomain: "thrift-scout-1b937.firebaseapp.com",
      projectId: "thrift-scout-1b937",
      storageBucket: "thrift-scout-1b937.firebasestorage.app",
      messagingSenderId: "559782240794",
      appId: "1:559782240794:web:5ace10f3f027b4cd82e7a3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const STATE = {
      geminiKey: localStorage.getItem('ts_gemini_key') || '',
      dailyScans: parseInt(localStorage.getItem('ts_scans_left') || '100', 10),
      vaultItems: []
    };

    let currentAppraisal = null;
    let selectedImageBase64 = null;
    let compressedThumbDataUrl = null;

    function updatePills() {
      document.getElementById('scanPill').textContent = STATE.dailyScans + ' SCANS';
      localStorage.setItem('ts_scans_left', STATE.dailyScans);
    }
    updatePills();

    window.resetQuota = function() {
      STATE.dailyScans = 100;
      updatePills();
      alert('Quota reset to 100.');
    };

    function triggerAlert(msg, isErr = false) {
      const box = document.getElementById('statusAlert');
      box.style.display = 'block';
      box.style.borderLeftColor = isErr ? 'var(--red)' : 'var(--emerald)';
      box.textContent = msg;
    }
    function dismissAlert() {
      document.getElementById('statusAlert').style.display = 'none';
    }

    document.querySelectorAll('.dock-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.dock-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-view').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.target).classList.add('active');
      });
    });

    const configModal = document.getElementById('configModal');
    document.getElementById('configBtn').onclick = () => {
      document.getElementById('geminiApiKey').value = STATE.geminiKey;
      configModal.classList.add('active');
    };
    document.getElementById('closeConfigBtn').onclick = () => configModal.classList.remove('active');
    document.getElementById('saveConfigBtn').onclick = () => {
      STATE.geminiKey = document.getElementById('geminiApiKey').value.trim();
      localStorage.setItem('ts_gemini_key', STATE.geminiKey);
      configModal.classList.remove('active');
      triggerAlert('API Key verified and saved.');
    };

    const mobileCam = document.getElementById('mobileCameraInput');
    const previewImg = document.getElementById('previewImg');
    const previewBox = document.getElementById('imagePreviewContainer');

    document.getElementById('snapMobileBtn').onclick = () => mobileCam.click();

    mobileCam.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width;
          let h = img.height;
          const maxDim = 500; // Ultra-lean sizing for sub-2-second speed
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.50).split(',')[1];
          previewImg.src = canvas.toDataURL('image/jpeg', 0.50);
          previewBox.style.display = 'block';

          const thumbCanvas = document.createElement('canvas');
          thumbCanvas.width = 100;
          thumbCanvas.height = Math.round((canvas.height * 100) / canvas.width);
          thumbCanvas.getContext('2d').drawImage(img, 0, 0, thumbCanvas.width, thumbCanvas.height);
          compressedThumbDataUrl = thumbCanvas.toDataURL('image/jpeg', 0.50);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    document.getElementById('evaluateBtn').onclick = async () => {
      if (!selectedImageBase64) {
        alert('Snap a photo first.');
        return;
      }
      if (!STATE.geminiKey) {
        alert('Set Gemini API key in Config.');
        configModal.classList.add('active');
        return;
      }
      if (STATE.dailyScans <= 0) {
        alert('Daily scan limit reached.');
        return;
      }

      triggerAlert('⚡ Turbo Recon running...');
      const cost = parseFloat(document.getElementById('purchaseCost').value) || 0;
      const endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=" + encodeURIComponent(STATE.geminiKey);

      const promptText = "Analyze this exact item (whether pen, remote control, DVD, electronic, tool, or general good). Identify the exact brand/manufacturer, specific model or title, release year (if media/electronics), detailed description of what it is, resale desirability, and realistic secondary market resale value in USD. Return ONLY valid, raw JSON without Markdown wraps:\n" +
        "{\n" +
        '  "brand": "Exact Brand or Studio (e.g. Bic, Sony, Universal Pictures)",\n' +
        '  "item": "Exact Title or Model Name & Release Year (e.g. Cristal Ballpoint Pen, TV Remote Control, How the Grinch Stole Christmas DVD (2000))",\n' +
        '  "resale": 10.00,\n' +
        '  "disposition": "FLIP",\n' +
        '  "platform": "eBay",\n' +
        '  "intel": "Detailed description of what this item is, release year, and why it is or isn\'t desirable for quick resale.",\n' +
        '  "query": "exact item keywords for ebay sold search"\n' +
        "}";

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inlineData: { mimeType: 'image/jpeg', data: selectedImageBase64 } }
              ]
            }]
          })
        });

        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.error?.message || ('HTTP ' + res.status));
        }

        const data = await res.json();
        const rawContent = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawContent) throw new Error('Model produced an empty evaluation.');

        const cleaned = rawContent.replace(/```json/gi, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(cleaned);

        const parsedBrand = parsed.brand || 'Unidentified Item';
        const parsedItem = parsed.item || 'Retail Good';
        const estResale = parseFloat(parsed.resale) || 5.00;
        const estProfit = estResale - cost - (estResale * 0.1325);

        currentAppraisal = {
          brand: parsedBrand,
          item: parsedItem,
          name: parsedBrand + " - " + parsedItem,
          cost: cost,
          resale: estResale,
          profit: Number(estProfit.toFixed(2)),
          platform: parsed.platform || 'eBay',
          disposition: parsed.disposition || 'MONITOR',
          intel: parsed.intel || 'Standard resale asset.',
          query: parsed.query || (parsedBrand + " " + parsedItem),
          imageThumb: compressedThumbDataUrl || ("data:image/jpeg;base64," + selectedImageBase64),
          purchasedAt: Date.now()
        };

        renderAppraisal(currentAppraisal);
        STATE.dailyScans--;
        updatePills();
        dismissAlert();

      } catch (err) {
        triggerAlert('Evaluation error: ' + err.message, true);
      }
    };

    function renderAppraisal(item) {
      document.getElementById('resItemTitle').textContent = item.name;
      document.getElementById('resEstResale').textContent = '$' + item.resale.toFixed(2);
      document.getElementById('resEstProfit').textContent = '$' + item.profit.toFixed(2);
      document.getElementById('resBrand').textContent = item.brand;
      document.getElementById('resPlatform').textContent = item.platform;
      document.getElementById('resIntel').textContent = item.intel;

      const pill = document.getElementById('resDispPill');
      pill.textContent = item.disposition;
      pill.className = 'disposition-pill ' + (item.disposition === 'FLIP' ? 'disp-flip' : item.disposition === 'MONITOR' ? 'disp-monitor' : 'disp-pass');

      const ebayUrl = "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(item.query) + "&LH_Sold=1&LH_Complete=1";
      document.getElementById('resEbayLink').href = ebayUrl;
      document.getElementById('appraisalCard').style.display = 'flex';
    }

    document.getElementById('saveVaultBtn').onclick = async () => {
      if (!currentAppraisal) return;
      try {
        triggerAlert('Syncing item to Cloud Vault...');
        await addDoc(collection(db, 'vault_inventory'), currentAppraisal);
        triggerAlert('Saved to Vault successfully.');
        alert('Item added to Cloud Vault!');
      } catch (err) {
        triggerAlert('Cloud sync failed: ' + err.item, true);
      }
    };

    onSnapshot(query(collection(db, 'vault_inventory'), orderBy('purchasedAt', 'desc')), (snap) => {
      STATE.vaultItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderVault();
    });

    function renderVault() {
      const container = document.getElementById('vaultItemList');
      container.innerHTML = '';
      let totalValue = 0;

      STATE.vaultItems.forEach(item => {
        totalValue += Number(item.profit || 0);
        const row = document.createElement('div');
        row.className = 'vault-item';
        row.innerHTML = 
          '<img class="item-thumb" src="' + (item.imageThumb || '') + '" alt="Thumb">' +
          '<div class="item-content">' +
            '<div class="item-title">' + item.name + '</div>' +
            '<div class="item-meta">Buy: $' + Number(item.cost).toFixed(2) + ' • Target: $' + Number(item.resale).toFixed(2) + '</div>' +
            '<div class="item-actions">' +
              '<button class="btn btn-outline" style="padding:4px 8px; font-size:0.75rem; width:auto; color:var(--red);" onclick="deleteCloudItem(\'' + item.id + '\')">DELETE</button>' +
            '</div>' +
          '</div>' +
          '<div style="text-align:right;">' +
            '<div style="color:var(--emerald); font-weight:800; font-size:1rem;">+$' + Number(item.profit).toFixed(2) + '</div>' +
          '</div>';
        container.appendChild(row);
      });

      document.getElementById('vaultTotal').textContent = '$' + totalValue.toFixed(2);
      document.getElementById('vaultCount').textContent = STATE.vaultItems.length + ' items';
    }

    window.deleteCloudItem = async (id) => {
      if (!confirm('Remove this item from cloud?')) return;
      try {
        await deleteDoc(doc(db, 'vault_inventory', id));
      } catch (err) {
        alert('Delete failed: ' + err.message);
      }
    };
  </script>
</body>
</html>
